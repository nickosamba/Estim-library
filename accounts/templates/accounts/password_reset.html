{% extends 'base.html' %}

{% block title %}Réinitialiser le mot de passe - Estim Library{% endblock %}

{% block content %}
<div class="px-margin-mobile pt-20 pb-40">
    <div class="max-w-md mx-auto bg-white rounded-[3rem] shadow-2xl overflow-hidden border border-outline-variant/20">
        <div class="p-10 border-b border-outline-variant/10 bg-surface-container-low/50">
            <h2 class="text-3xl font-extrabold text-on-background tracking-tighter">Mot de passe oublié ?</h2>
            <p class="text-label-md text-outline mt-2">Entrez votre email pour recevoir un lien de réinitialisation.</p>
        </div>
        <form method="POST" class="p-10 space-y-6">
            {% csrf_token %}
            <div class="space-y-2">
                <label for="id_email" class="block text-[10px] font-extrabold text-primary uppercase tracking-widest ml-1">Adresse Email</label>
                <input type="email" name="email" id="id_email" required class="w-full px-6 py-4 rounded-2xl bg-surface-container-low border-none focus:ring-2 focus:ring-primary/20 transition-all font-bold">
            </div>
            <button type="submit" class="w-full bg-primary text-white py-4 rounded-2xl font-bold shadow-xl shadow-primary/20 hover:brightness-110 active:scale-95 transition-all">
                Envoyer le lien
            </button>
        </form>
    </div>
</div>
{% endblock %}
