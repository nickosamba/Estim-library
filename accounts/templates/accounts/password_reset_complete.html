{% extends 'base.html' %}

{% block title %}Mot de passe modifié - Estim Library{% endblock %}

{% block content %}
<div class="px-margin-mobile pt-20 pb-40 text-center">
    <div class="max-w-md mx-auto bg-white rounded-[3rem] shadow-2xl p-12 border border-outline-variant/20">
        <div class="w-20 h-20 bg-success/10 rounded-full flex items-center justify-center text-success mx-auto mb-8">
            <span class="material-symbols-outlined text-4xl">check_circle</span>
        </div>
        <h2 class="text-3xl font-extrabold text-on-background tracking-tighter mb-4">Succès !</h2>
        <p class="text-body-lg text-outline leading-relaxed mb-10">
            Votre mot de passe a été réinitialisé avec succès. Vous pouvez maintenant vous connecter avec votre nouveau mot de passe.
        </p>
        <a href="{% url 'login' %}" class="inline-block bg-primary text-white px-10 py-4 rounded-2xl font-bold shadow-xl shadow-primary/20 hover:brightness-110 transition-all">
            Se connecter
        </a>
    </div>
</div>
{% endblock %}
